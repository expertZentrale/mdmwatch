name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: App bauen (Universal)
        run: UNIVERSAL=1 ./bundle.sh

      - name: Zip
        run: |
          cd target
          ditto -c -k --keepParent "MDM Watch.app" "MDM-Watch-${VERSION}.zip"
          lipo -info "MDM Watch.app/Contents/MacOS/MDMWatch"

      - uses: actions/upload-artifact@v4
        with:
          name: MDM-Watch-${{ env.VERSION }}
          path: target/MDM-Watch-${{ env.VERSION }}.zip

      - name: Release anlegen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "target/MDM-Watch-${VERSION}.zip" \
            --title "MDM Watch ${VERSION}" --generate-notes
